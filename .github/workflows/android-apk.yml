name: Android APK

# Builds an installable APK and publishes it as the "apk-latest" release.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # arm64 covers practically every modern Android phone and halves the build time.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk geoflags.apk

      - uses: actions/upload-artifact@v4
        with:
          name: geoflags-apk
          path: geoflags.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="APK generado automáticamente desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Descarga geoflags.apk en el móvil e instálalo."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest geoflags.apk --clobber
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest geoflags.apk --prerelease --title "GeoFlags (última versión)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
